name: Make a download release
# Puts files from downloads/ into a GitHub release, so GitHub counts each download.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. alloy-0.6"
        required: true
      title:
        description: "Release title"
        required: true
      files:
        description: "Space-separated files in downloads/"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          FILES: ${{ inputs.files }}
        run: |
          set -e
          args=""
          for f in $FILES; do test -f "downloads/$f"; args="$args downloads/$f"; done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $args --clobber
          else
            gh release create "$TAG" $args --title "$TITLE" --notes "Downloads for cymbalsamples.com"
          fi
